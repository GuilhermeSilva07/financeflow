spring.application.name=financeflow

# Database
spring.datasource.url=${FINANCEFLOW_DB_URL:jdbc:h2:mem:financeflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${FINANCEFLOW_DB_USERNAME:sa}
spring.datasource.password=${FINANCEFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=${FINANCEFLOW_DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${FINANCEFLOW_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
