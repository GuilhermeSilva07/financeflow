<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --primary: #1d4ed8;
            --primary-dark: #162a66;
            --success: #16a34a;
            --danger: #dc2626;
            --text: #152033;
            --muted: #61708a;
            --border: #dfe7f3;
            --shadow: 0 18px 40px rgba(18, 38, 63, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f7f9fc 100%);
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .brand {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .balance-card {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            min-width: 260px;
            border-radius: 18px;
            padding: 22px 24px;
            box-shadow: var(--shadow);
        }

        .balance-card span {
            display: block;
            font-size: 0.82rem;
            opacity: 0.8;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .balance-value {
            display: block;
            margin-top: 10px;
            font-size: clamp(1.8rem, 2vw, 2.5rem);
            font-weight: 700;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(280px, 380px) 1fr;
            gap: 26px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-header {
            padding: 22px 24px 16px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.35rem;
        }

        .form-body {
            padding: 22px 24px 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        input,
        select,
        button {
            width: 100%;
            font: inherit;
        }

        input,
        select {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f9fbff;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: rgba(29, 78, 216, 0.5);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.08);
        }

        .primary-button {
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            color: white;
            font-weight: 700;
            padding: 14px 16px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .table-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-wrapper {
            padding: 0 18px 18px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            background: #f9fbff;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        .type-badge,
        .category-tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .income {
            background: rgba(22, 163, 74, 0.12);
            color: var(--success);
        }

        .expense {
            background: rgba(220, 38, 38, 0.12);
            color: var(--danger);
        }

        .category-tag {
            background: rgba(29, 78, 216, 0.08);
            color: var(--primary);
        }

        .amount {
            font-weight: 700;
        }

        .amount.income {
            color: var(--success);
        }

        .amount.expense {
            color: var(--danger);
        }

        .delete-button {
            border: none;
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger);
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .delete-button:hover {
            background: rgba(220, 38, 38, 0.15);
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 28px 20px;
        }

        .status-message {
            margin-top: 16px;
            min-height: 20px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .status-message.error {
            color: var(--danger);
        }

        .status-message.success {
            color: var(--success);
        }

        @media (max-width: 860px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">FinanceFlow</div>
            <div class="balance-card">
                <span>Saldo atual</span>
                <strong id="saldoAtual" class="balance-value">R$ 0,00</strong>
            </div>
        </header>

        <main class="dashboard">
            <section class="panel">
                <div class="panel-header">
                    <h2>Nova transação</h2>
                </div>
                <div class="form-body">
                    <form id="transactionForm">
                        <div class="field">
                            <label for="description">Descrição</label>
                            <input id="description" name="description" type="text" placeholder="Ex.: Salário, Mercado, Transporte" required>
                        </div>

                        <div class="field">
                            <label for="value">Valor</label>
                            <input id="value" name="value" type="number" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>

                        <div class="field">
                            <label for="type">Tipo</label>
                            <select id="type" name="type" required>
                                <option value="INCOME">Receita</option>
                                <option value="EXPENSE">Despesa</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="category">Categoria</label>
                            <select id="category" name="category" required>
                                <option value="SALARY">Salário</option>
                                <option value="FOOD">Alimentação</option>
                                <option value="TRANSPORT">Transporte</option>
                                <option value="HEALTH">Saúde</option>
                                <option value="ENTERTAINMENT">Entretenimento</option>
                                <option value="OTHERS">Outros</option>
                            </select>
                        </div>

                        <button type="submit" class="primary-button">Registrar transação</button>
                        <div id="statusMessage" class="status-message" aria-live="polite"></div>
                    </form>
                </div>
            </section>

            <section class="panel table-panel">
                <div class="panel-header">
                    <h2>Histórico</h2>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        const transactionForm = document.getElementById('transactionForm');
        const transactionTableBody = document.getElementById('transactionTableBody');
        const statusMessage = document.getElementById('statusMessage');
        const saldoAtual = document.getElementById('saldoAtual');

        const typeLabels = {
            INCOME: 'Receita',
            EXPENSE: 'Despesa'
        };

        const categoryLabels = {
            FOOD: 'Alimentação',
            TRANSPORT: 'Transporte',
            HEALTH: 'Saúde',
            ENTERTAINMENT: 'Entretenimento',
            SALARY: 'Salário',
            OTHERS: 'Outros'
        };

        function setStatus(message, type = '') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            if (type) {
                statusMessage.classList.add(type);
            }
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(Number(value || 0));
        }

        async function request(url, options = {}) {
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || 'Erro ao realizar a operação.');
            }

            if (response.status === 204) {
                return null;
            }

            return response.json();
        }

        async function loadSaldo() {
            try {
                const saldo = await request('/transactions/saldo');
                const total = Number(saldo?.saldo ?? 0);
                saldoAtual.textContent = formatCurrency(total);
                saldoAtual.style.color = '#ffffff';
            } catch (error) {
                console.error(error);
                saldoAtual.textContent = 'R$ 0,00';
            }
        }

        async function loadTransactions() {
            try {
                const transactions = await request('/transactions');

                if (!transactions || transactions.length === 0) {
                    transactionTableBody.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhuma transação cadastrada.</td></tr>';
                    return;
                }

                transactionTableBody.innerHTML = transactions.map((transaction) => {
                    const type = transaction.type;
                    const typeClass = type === 'INCOME' ? 'income' : 'expense';
                    const amountClass = type === 'INCOME' ? 'amount income' : 'amount expense';
                    const amount = Number(transaction.value || 0);
                    const formattedValue = type === 'INCOME' ? `+${formatCurrency(amount)}` : `-${formatCurrency(amount)}`;

                    return `
                        <tr>
                            <td>${transaction.description}</td>
                            <td><span class="category-tag">${categoryLabels[transaction.category] || transaction.category}</span></td>
                            <td><span class="type-badge ${typeClass}">${typeLabels[type] || type}</span></td>
                            <td class="${amountClass}">${formattedValue}</td>
                            <td>
                                <button class="delete-button" data-delete-id="${transaction.id}" type="button">Excluir</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error(error);
                transactionTableBody.innerHTML = '<tr><td colspan="5" class="empty-state">Não foi possível carregar o histórico.</td></tr>';
            }
        }

        transactionForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const description = document.getElementById('description').value.trim();
            const value = Number(document.getElementById('value').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            if (!description || Number.isNaN(value) || value <= 0) {
                setStatus('Preencha a descrição e o valor corretamente.', 'error');
                return;
            }

            try {
                setStatus('Salvando transação...', '');

                await request('/transactions', {
                    method: 'POST',
                    body: JSON.stringify({
                        description,
                        value,
                        type,
                        category
                    })
                });

                setStatus('Transação registrada com sucesso!', 'success');
                transactionForm.reset();
                await Promise.all([loadSaldo(), loadTransactions()]);
            } catch (error) {
                console.error(error);
                setStatus(error.message || 'Não foi possível registrar a transação.', 'error');
            }
        });

        document.addEventListener('click', async (event) => {
            const deleteButton = event.target.closest('[data-delete-id]');
            if (!deleteButton) {
                return;
            }

            const id = deleteButton.getAttribute('data-delete-id');

            try {
                setStatus('Excluindo transação...', '');
                await request(`/transactions/${id}`, { method: 'DELETE' });
                setStatus('Transação removida com sucesso!', 'success');
                await Promise.all([loadSaldo(), loadTransactions()]);
            } catch (error) {
                console.error(error);
                setStatus(error.message || 'Não foi possível excluir a transação.', 'error');
            }
        });

        async function initializePage() {
            await Promise.all([loadSaldo(), loadTransactions()]);
        }

        initializePage();
    </script>
</body>
</html>
